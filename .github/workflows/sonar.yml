name: Spring Boot SonarQube Analysis

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

  workflow_dispatch:

permissions:
  contents: read

jobs:
  sonar-analysis:
    name: Build, Test & SonarQube
    runs-on: [self-hosted, Windows, X64]

    steps:

      # --------------------------------------------------
      # 1. Checkout source code
      # --------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # --------------------------------------------------
      # 2. Setup Java 21
      # --------------------------------------------------
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # --------------------------------------------------
      # 3. Find Maven project
      # --------------------------------------------------
      - name: Find pom.xml
        shell: cmd
        run: |
          echo Current directory:
          cd
          echo.
          echo Searching for pom.xml...
          dir /s /b pom.xml

      # --------------------------------------------------
      # 4. Build and run tests
      # --------------------------------------------------
      - name: Build and test
        shell: cmd
        run: |
          for /f "delims=" %%i in ('dir /s /b pom.xml') do (
            set "POM_PATH=%%i"
            goto :found
          )

          echo ERROR: pom.xml not found
          exit /b 1

          :found
          echo Found pom.xml:
          echo %POM_PATH%

          for %%i in ("%POM_PATH%") do set "PROJECT_DIR=%%~dpi"

          echo Maven project directory:
          echo %PROJECT_DIR%

          cd /d "%PROJECT_DIR%"

          echo Running Maven build...
          mvn clean verify

      # --------------------------------------------------
      # 5. SonarQube analysis
      # --------------------------------------------------
      - name: SonarQube analysis
        shell: cmd
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: http://localhost:9002
        run: |
          for /f "delims=" %%i in ('dir /s /b pom.xml') do (
            set "POM_PATH=%%i"
            goto :sonar_found
          )

          echo ERROR: pom.xml not found
          exit /b 1

          :sonar_found
          echo Found pom.xml:
          echo %POM_PATH%

          for %%i in ("%POM_PATH%") do set "PROJECT_DIR=%%~dpi"

          echo Maven project directory:
          echo %PROJECT_DIR%

          cd /d "%PROJECT_DIR%"

          echo Running SonarQube analysis...

          mvn sonar:sonar ^
            -Dsonar.projectKey=employee-service ^
            -Dsonar.projectName="Employee Service" ^
            -Dsonar.host.url=%SONAR_HOST_URL% ^
            -Dsonar.token=%SONAR_TOKEN%
